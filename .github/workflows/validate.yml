name: Validate Repository

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate knowledge base
        run: python3 scripts/validate_knowledge_base.py

      - name: Generate sample digest
        run: python3 scripts/generate_weekly_digest.py --date 2026-08-09
