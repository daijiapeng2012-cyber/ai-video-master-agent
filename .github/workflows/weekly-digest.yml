name: Weekly Digest

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate knowledge base
        run: python3 scripts/validate_knowledge_base.py

      - name: Generate weekly digest
        run: python3 scripts/generate_weekly_digest.py

      - name: Commit digest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/weekly
          git diff --cached --quiet || git commit -m "weekly: refresh digest"
          git push
